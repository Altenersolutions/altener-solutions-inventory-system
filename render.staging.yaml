# STAGING copy of render.yaml: use a SEPARATE Atlas database (e.g. inventory_staging) in MONGO_URI so tests never touch live data.
# Optional Render Blueprint. You can also create the Web Service by hand with the same values (see README).
services:
  - type: web
    name: inventory-wms-api-staging
    runtime: node
    plan: free   # free plan sleeps after 15 min idle (first request is slow) - use "starter" for a real production go-live
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ready   # 503 while MongoDB is down, so Render restarts the instance
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "20" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: MONGO_URI, sync: false }
      - { key: CORS_ORIGINS, sync: false }          # REQUIRED: https://<your-site>.netlify.app (no trailing slash)
      - { key: REQUIRE_TRANSACTIONS, value: "true" }
      - { key: MAX_FAILED_LOGINS, value: "5" }
      - { key: LOCK_MINUTES, value: "15" }
      - { key: BOOTSTRAP_ADMIN_EMAIL, sync: false }
      - { key: BOOTSTRAP_ADMIN_PASSWORD, sync: false }
      - { key: SEED_ON_START, value: "false" }
      - { key: SEED_DEMO_USERS, value: "false" }
      - { key: SERVE_LEGACY, value: "false" }
