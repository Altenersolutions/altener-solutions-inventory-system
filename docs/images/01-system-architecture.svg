<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>System architecture</title>
<desc>People use the frontend on Netlify, which talks to the backend on Render, which stores everything in MongoDB Atlas.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<rect x="190" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">People</text><text x="340.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Phones, PCs, barcode scanners</text>
<line x1="340" y1="90" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="122" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="142.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Frontend (Netlify)</text><text x="340.0" y="161.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">The screens people use</text>
<line x1="340" y1="182" x2="340" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="214" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="234.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">Backend (Render)</text><text x="340.0" y="253.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">All rules and permissions</text>
<line x1="340" y1="274" x2="340" y2="302" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="190" y="306" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="326.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Database (MongoDB Atlas)</text><text x="340.0" y="345.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Records, files, audit trail</text>
</svg>
