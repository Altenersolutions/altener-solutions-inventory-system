<line x1="352" y1="158" x2="330" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="194" y1="158" x2="172" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="104" y1="190" x2="104" y2="226" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="230" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="104.0" y="250.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">Final QC</text><text x="104.0" y="269.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">rework if fail</text>
<rect x="198" y="230" width="128" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="262.0" y="250.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Release</text><text x="262.0" y="269.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">authorised person</text>
<rect x="356" y="230" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="420.0" y="250.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Dispatch</text><text x="420.0" y="269.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">on a gate pass</text>
<line x1="172" y1="258" x2="194" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="258" x2="352" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
