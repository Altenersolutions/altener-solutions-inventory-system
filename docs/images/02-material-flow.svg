<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img">
<title>Material flow from purchase order to dispatch</title>
<desc>Material is received, passes QC, is stored, issued, installed on a vehicle, passes final QC, is released and dispatched.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="370" fill="#FFFFFF"/>
<rect x="40" y="30" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="104.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">PO (optional)</text><text x="104.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">supplier order</text>
<rect x="198" y="30" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="262.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Receiving</text><text x="262.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">GRN + invoice</text>
<rect x="356" y="30" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="420.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">Incoming QC</text><text x="420.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">pass or reject</text>
<rect x="514" y="30" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="578.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Put-away</text><text x="578.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">bin, FIFO</text>
<line x1="172" y1="58" x2="194" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="58" x2="352" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="488" y1="58" x2="510" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="578" y1="90" x2="578" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="514" y="130" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="578.0" y="150.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Reserve / kit</text><text x="578.0" y="169.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">optional</text>
<rect x="356" y="130" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="420.0" y="150.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Issue / handover</text><text x="420.0" y="169.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">recipient signs</text>
<rect x="198" y="130" width="128" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="262.0" y="150.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Install on vehicle</text><text x="262.0" y="169.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">checked vs BOM</text>
<rect x="40" y="130" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="104.0" y="150.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">In-process QC</text><text x="104.0" y="169.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">during build</text>
