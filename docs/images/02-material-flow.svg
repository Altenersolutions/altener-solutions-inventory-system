<rect x="121" y="322" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text x="139" y="328" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Quality</text>
<rect x="216" y="322" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/><text x="234" y="328" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Production</text>
</svg>
