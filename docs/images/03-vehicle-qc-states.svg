<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
<title>Vehicle states after assembly</title>
<desc>An assembled vehicle passes final QC to be QC approved, then released, then dispatched. If final QC fails it goes through rework and retest.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" fill="#FFFFFF"/>
<rect x="40" y="30" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="104.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Assembled</text><text x="104.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">BOM complete</text>
<rect x="198" y="30" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="262.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">QC approved</text><text x="262.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">final QC pass</text>
<rect x="356" y="30" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="420.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041">Released</text><text x="420.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">authorised</text>
<rect x="514" y="30" width="128" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="578.0" y="50.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Dispatched</text><text x="578.0" y="69.19999999999999" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">gate pass</text>
<line x1="172" y1="58" x2="194" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="58" x2="352" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="488" y1="58" x2="510" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="104" y1="90" x2="104" y2="146" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="150" width="128" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="104.0" y="170.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">QC failed</text><text x="104.0" y="189.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">rework needed</text>
<rect x="198" y="150" width="128" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="262.0" y="170.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">Rework</text><text x="262.0" y="189.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">fix and re-fit</text>
<rect x="356" y="150" width="128" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="420.0" y="170.16" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#712B13">Pending retest</text><text x="420.0" y="189.2" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">after rework</text>
<line x1="172" y1="178" x2="194" y2="178" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="330" y1="178" x2="352" y2="178" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M420 146 L420 118 L262 118 L262 90" fill="none" stroke="#1D9E75" stroke-width="1.5"  marker-end="url(#ag)"/>
<path d="M420 210 L420 240 L104 240 L104 210" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="262" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Retest fails: back to QC failed</text>
<text x="341" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Retest passes</text>
<rect x="40" y="292" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/><text x="58" y="298" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Normal path</text>
<rect x="163" y="292" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D"/><text x="181" y="298" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Failure and rework</text>
</svg>
